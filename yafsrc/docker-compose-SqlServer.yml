networks: 
  dev: 
    driver: bridge

services:
  yafnet:
    image: yafnet/yafnet:latest-sqlserver
    depends_on:
      sql-server-db:
        condition: service_healthy      # wait for SQL Server to be ready
      sql-server-init:
        condition: service_completed_successfully   # wait for DB to be created
    environment:
      - ConnectionStrings__DefaultConnection=data source=sql-server-db;Initial Catalog=yaf;User Id=sa;Password=MyPass@word;TrustServerCertificate=true # change default password
      - BoardConfiguration__ConnectionProviderName=Microsoft.Data.SqlClient
      # the database backup: SQL Server writes the backup into the yaf-backups volume, mounted into both containers
      - BoardConfiguration__SqlServerBackupFolder=/var/opt/mssql/backup
      # mail server for registration mails, password resets and notifications, replace with real settings
      #- MailConfiguration__Host=smtp.example.com
      #- MailConfiguration__Port=587
      #- MailConfiguration__UserName=
      #- MailConfiguration__Password=
      - ASPNETCORE_URLS=http://+:89 
    container_name: yafnet
    volumes:
      - yaf-backups:/app/App_Data/Backups   # the database backups (Admin > Database > Backup)
    ports:
      - "8001:89"
    networks:
      - dev

  sql-server-db:
    container_name: sql-server-db
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      sql-server-backup-init:
        condition: service_completed_successfully   # the backup folder is writable for SQL Server
    ports:
      - "8002:1433"
    environment:
      - MSSQL_SA_PASSWORD=MyPass@word # change default password
      - ACCEPT_EULA=Y
    volumes:
      - mssql-data:/var/opt/mssql
      - yaf-backups:/var/opt/mssql/backup   # shared with yafnet for the database backups
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U sa -P "MyPass@word"
        -No -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s        # SQL Server takes ~20s to start
    networks:
      - dev

  sql-server-backup-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    user: root
    volumes:
      - yaf-backups:/backup
    # SQL Server runs as the user mssql (10001), the application as root
    entrypoint: /bin/bash -c "chown 10001:0 /backup && chmod 775 /backup"
    networks:
      - dev
    restart: "no"                        # run once and exit

  sql-server-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      sql-server-db:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=MyPass@word
    volumes:
      - ./docker/yaf-sqlserver:/init-db:ro    # mount the init script (read-only)
    entrypoint: /bin/bash /init-db/create-db.sh
    networks:
      - dev
    restart: "no"                        # run once and exit
    
volumes:
  mssql-data:
  yaf-backups:
