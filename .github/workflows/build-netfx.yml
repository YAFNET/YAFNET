name: YAF.NET v3.2.x (.NET Framework v4.8.1)
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: netfx

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed to publish the coverage badges to the "badges-netfx" branch
      pull-requests: write

    steps:
    - uses: actions/checkout@v7
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
      with:
        vs-version: '18'

    - name: Restore Packages
      run: msbuild ./yafsrc/YAF.NET-SqlServer.slnx -t:restore -p:RestorePackagesConfig=true

    - name: Test Solution
      run: dotnet test ./yafsrc/YAF.NET-SqlServer.slnx --collect:"XPlat Code Coverage" --results-directory TestResults

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: TestResults/**/coverage.cobertura.xml

    - name: Generate coverage report
      shell: bash
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        reportgenerator \
          "-reports:TestResults/**/coverage.cobertura.xml" \
          "-targetdir:coveragereport" \
          "-reporttypes:Badges;MarkdownSummaryGithub" \
          "-assemblyfilters:+YAF.*;-YAF.Tests*" \
          "-classfilters:-System.Text.RegularExpressions.Generated*"
        cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    - name: Publish coverage badges
      if: github.ref == 'refs/heads/netfx'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir badges
        cp coveragereport/badge_linecoverage.svg coveragereport/badge_branchcoverage.svg badges/
        cd badges
        git init -q -b badges-netfx
        git add .
        git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update coverage badges"
        git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" badges-netfx
